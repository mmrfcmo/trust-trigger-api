# Render deployment config
services:
  - type: web
    name: trust-trigger-api
    env: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trust-trigger-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://srv16.aisoftllc.com,http://localhost:3000

databases:
  - name: trust-trigger-db
    region: frankfurt
    plan: free
    databaseName: trust_trigger_os
    ipAllowList: []