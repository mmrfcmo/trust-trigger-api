# Render deployment config - using SQLite for now
services:
  - type: web
    name: trust-trigger-api
    env: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://srv16.aisoftllc.com,http://localhost:3000
      - key: APP_NAME
        value: Trust Trigger Agency
      - key: APP_VERSION
        value: 1.0.0